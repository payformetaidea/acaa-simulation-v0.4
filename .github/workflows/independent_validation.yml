name: ACAA Independent Validation v0.4

on:
  workflow_run:
    workflows: ["ACAA Engine v0.4 — Independent Execution (Gatekeeper)"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  validate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout execution revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download execution artifacts
        uses: actions/download-artifact@v4
        with:
          name: acaa-engine-v0.4-independent-artifacts
          path: artifacts/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Run independent validator
        run: |
          python3 independent_validator_v0.4.py --artifacts artifacts/
        env:
          PYTHONUNBUFFERED: 1

      - name: Upload validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: artifacts/validation_result.json
          if-no-files-found: error
          retention-days: 30
