name: F2.3 Baseline Provenance Reconciliation

on:
  push:
    branches:
      - research/mp1-v1.1-s1v-f1-fixture-reconciliation
  workflow_dispatch:

jobs:
  f2-3:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout controlled investigation branch
        uses: actions/checkout@v4
        with:
          ref: research/mp1-v1.1-s1v-f1-fixture-reconciliation
          fetch-depth: 0

      - name: Verify target commit is present
        shell: bash
        run: |
          set -euo pipefail
          TARGET=d1cef3768ccaa39525a0c23e1a9b94c3528a8995
          git cat-file -e "$TARGET^{commit}"
          test "$(git rev-parse "$TARGET^{commit}")" = "$TARGET"

      - name: Run F2.3-R1 provenance reconciliation
        shell: bash
        run: |
          set -uo pipefail
          python infrastructure/schema-conformance/reconcile_baseline_provenance_v2.py > f2.3-r1-report.json 2> f2.3-r1-report.stderr
          rc=$?
          echo "$rc" > f2.3-r1-exit-code.txt
          exit "$rc"

      - name: Upload F2.3-R1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f2.3-r1-baseline-provenance-${{ github.sha }}-${{ github.run_id }}
          path: |
            f2.3-r1-report.json
            f2.3-r1-report.stderr
            f2.3-r1-exit-code.txt
          if-no-files-found: error
          retention-days: 90
