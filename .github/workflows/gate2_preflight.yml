name: ACAA Gate 2 — Preflight Only

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/research-control-layer/v0.6-gate2/**'
      - 'scripts/gate2_execution_preflight.py'
      - '.github/workflows/gate2_preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify preflight only
        run: python3 scripts/gate2_execution_preflight.py
