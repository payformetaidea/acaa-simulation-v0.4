name: O2 Controlled Implementation

on:
  push:
    branches:
      - agent/v0.5-controlled-implementation-o2
  pull_request:
    branches:
      - main
      - agent/v0.5-implementation-design
      - agent/v0.5-controlled-implementation-o2

jobs:
  o2-controlled:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: O2 contract tests
        run: pytest -q tests/test_o2_identity_v0_5.py -vv
      - name: Controlled O2 execution
        run: python o2_identity_v0_5.py --seed 42 --periods 100 --output o2_identity_evidence.json
      - name: Independent O2 evidence validation
        run: python independent_o2_validator_v0_5.py o2_identity_evidence.json
      - name: v0.4 regression
        run: python value_flow_simulator_v0.4.py --regression
