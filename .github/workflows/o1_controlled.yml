name: ACAA v0.5 — O1 Controlled Implementation

on:
  push:
    branches:
      - agent/v0.5-controlled-implementation-o1
  pull_request:
    branches:
      - agent/v0.5-implementation-design
      - agent/research-to-objective-gate
      - main

permissions:
  contents: read

jobs:
  o1-controlled:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Unit Tests — O1 Contract
        run: |
          python -m unittest discover -s tests -p 'test_o1_robustness_v0_5.py' -v

      - name: O1 Controlled Execution
        run: |
          set +e
          python3 o1_robustness_v0_5.py --engine value_flow_simulator_v0.4.py --output-dir o1_evidence 2>&1 | tee o1_execution.log
          status=${PIPESTATUS[0]}
          echo "O1_EXIT_CODE=${status}" | tee -a o1_execution.log
          exit "${status}"

      - name: O1 Failure Diagnostics
        if: ${{ failure() }}
        run: |
          if [ -f o1_execution.log ]; then
            tail -c 6000 o1_execution.log | sed 's/%/%25/g' | sed 's/\r/%0D/g' | sed 's/\n/%0A/g' | xargs -0 -r echo '::error title=O1 execution diagnostics::'
            cat o1_execution.log
          fi

      - name: Verify O1 Evidence Structure
        if: ${{ success() }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('o1_evidence/o1_evidence.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['objective'] == 'O1'
          assert data['protocol']['planned_seed_set'] == data['protocol']['executed_seed_set']
          assert data['protocol']['seed_count'] == 12
          assert len(data['configuration']['base_fingerprints']) == 1
          assert len(data['configuration']['engine_hashes']) == 1
          assert len(data['runs']) == 12
          assert all(len(r['artifact_digest']) == 64 for r in data['runs'])
          print('O1 evidence structure: PASS')
          PY

      - name: Upload O1 Evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: acaa-v0.5-o1-evidence-${{ github.run_id }}
          path: |
            o1_evidence/
            o1_execution.log
          if-no-files-found: warn
          retention-days: 30
