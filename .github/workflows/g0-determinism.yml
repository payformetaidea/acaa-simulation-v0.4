name: G0 Determinism and Dataset Lock Gate

on:
  push:
    branches:
      - execution-engineering/h-aicr-g0-v2
  pull_request:
    branches:
      - execution-engineering/h-aicr-g0-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  determinism-and-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scientific validation dependency
        run: python -m pip install --disable-pip-version-check -r execution/requirements-scientific.txt

      - name: Run deterministic generator test
        run: python execution/test_determinism.py

      - name: Build and verify G0 dataset lock artifacts
        run: python execution/build_dataset_lock.py --output-dir "$RUNNER_TEMP/acaa-g0-lock"

      - name: Upload lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: acaa-g0-dataset-lock
          path: ${{ runner.temp }}/acaa-g0-lock/
          if-no-files-found: error
          retention-days: 14
